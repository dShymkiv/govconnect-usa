<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SMS Opt-in — GovConnect USA</title>
  <style>
    :root { --ink: #0a0a0a; --muted: #5c5c5c; --line: #e5e7eb; --bg: #f3f4f6; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", system-ui, sans-serif;
      background: var(--bg);
      color: var(--ink);
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 1.5rem;
    }
    .card {
      width: min(420px, 100%);
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 1.5rem 1.4rem 1.25rem;
      box-shadow: 0 12px 32px rgba(0,0,0,.06);
    }
    .brand { font-weight: 700; font-size: 0.95rem; margin-bottom: 1rem; }
    h1 { font-size: 1.35rem; margin: 0 0 0.5rem; }
    .hint { color: var(--muted); font-size: 0.92rem; margin: 0 0 1rem; }
    label { display: block; font-size: 0.85rem; margin: 0.75rem 0 0.35rem; }
    input[type="tel"], input[type="password"] {
      width: 100%;
      padding: 0.7rem 0.8rem;
      border: 1px solid #111;
      border-radius: 10px;
      font: inherit;
    }
    .consent {
      display: flex;
      gap: 0.65rem;
      align-items: flex-start;
      margin: 1rem 0 1.1rem;
      font-size: 0.88rem;
      line-height: 1.4;
    }
    .consent input { margin-top: 0.2rem; }
    button {
      width: 100%;
      border: 0;
      border-radius: 999px;
      padding: 0.8rem 1rem;
      background: #111;
      color: #fff;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
    }
    .fine {
      margin-top: 0.9rem;
      font-size: 0.78rem;
      color: var(--muted);
      line-height: 1.4;
    }
    .links { margin-top: 0.75rem; font-size: 0.8rem; }
    .links a { color: #1d4ed8; }
  </style>
</head>
<body>
  <div class="card">
    <div class="brand">GovConnect USA</div>
    <h1>Sign in</h1>
    <p class="hint">Academic prototype — SMS one-time codes for two-factor login.</p>

    <label for="phone">Mobile number</label>
    <input id="phone" type="tel" value="+13129609078" readonly />

    <label for="password">Password</label>
    <input id="password" type="password" value="••••••••••" readonly />

    <div class="consent">
      <input id="sms" type="checkbox" checked disabled />
      <label for="sms" style="margin:0">
        I agree to receive SMS messages from GovConnect USA for verification codes and service notices.
        Message frequency varies. Msg &amp; data rates may apply. Reply <strong>STOP</strong> to opt out,
        <strong>HELP</strong> for help.
      </label>
    </div>

    <button type="button">Continue</button>

    <p class="fine">
      Submitting this form requests a transactional SMS one-time passcode to the mobile number above.
      This page documents the SMS opt-in flow for Twilio A2P registration.
    </p>
    <p class="links">
      <a href="./privacy.html">Privacy Policy</a> ·
      <a href="./terms.html">Terms</a>
    </p>
  </div>
</body>
</html>
